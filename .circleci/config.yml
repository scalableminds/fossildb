version: 2.1
jobs:
  build_and_push:
    machine:
      image: ubuntu-2404:2026.05.1
    environment:
      SBT_VERSION_TAG: master__7830403826
      TARGET_DIR: target/scala-3.10.0
    steps:
      - checkout

      - run:
          name: Set docker tag
          # Branch names may contain characters like '/' that are invalid in docker tags
          command: echo "export DOCKER_TAG=$(echo "$CIRCLE_BRANCH" | sed 's/[^A-Za-z0-9._-]/-/g')" >> $BASH_ENV

      - run:
          name: Set build user
          # The sbt container must run as the owner of the checkout to write target/
          command: |
            echo "export USER_UID=$(id -u)" >> $BASH_ENV
            echo "export USER_GID=$(id -g)" >> $BASH_ENV

      - run:
          name: Build server
          command: docker compose run -T -e CI=$CI sbt sbt assembly

      - run:
          name: Get FossilDB version
          command: docker compose run -T sbt java -jar $TARGET_DIR/fossildb.jar --version > $TARGET_DIR/version

      - run:
          name: Build server docker image
          command: |
            docker build \
            -t scalableminds/fossildb:${DOCKER_TAG}__${CIRCLE_BUILD_NUM} \
            -t scalableminds/fossildb:${DOCKER_TAG} \
            .
      - run:
          name: Build client docker image
          command: |
            docker build \
            -f client/Dockerfile \
            -t scalableminds/fossildb-client:${DOCKER_TAG}__${CIRCLE_BUILD_NUM} \
            -t scalableminds/fossildb-client:${DOCKER_TAG} \
            .

      - run:
          name: Smoke test
          command: |
            FOSSILDB_TAG=${DOCKER_TAG}__${CIRCLE_BUILD_NUM} \
            docker compose up -d fossildb
            sleep 1
            FOSSILDB_TAG=${DOCKER_TAG}__${CIRCLE_BUILD_NUM} \
            FOSSILDB_CLIENT_TAG=${DOCKER_TAG}__${CIRCLE_BUILD_NUM} \
            docker compose run fossildb-health-check
            docker compose down

      - run:
          name: Push to Dockerhub
          command: |
            echo $DOCKER_PASS | docker login -u $DOCKER_USER --password-stdin
            docker push scalableminds/fossildb:${DOCKER_TAG}__${CIRCLE_BUILD_NUM}
            docker push scalableminds/fossildb:${DOCKER_TAG}
            docker push scalableminds/fossildb-client:${DOCKER_TAG}__${CIRCLE_BUILD_NUM}
            docker push scalableminds/fossildb-client:${DOCKER_TAG}
            if [ "${CIRCLE_BRANCH}" == "master" ]; then
              VERSION=$(cat $TARGET_DIR/version)
              docker tag scalableminds/fossildb:${DOCKER_TAG}__${CIRCLE_BUILD_NUM} scalableminds/fossildb:${VERSION}
              docker push scalableminds/fossildb:${VERSION}
              docker tag scalableminds/fossildb-client:${DOCKER_TAG}__${CIRCLE_BUILD_NUM} scalableminds/fossildb-client:${VERSION}
              docker push scalableminds/fossildb-client:${VERSION}
            fi
            docker logout

      - run:
          name: Show version
          command: cat $TARGET_DIR/version

      - run:
          name: Release JAR on Github
          command: |
            if [ "${CIRCLE_BRANCH}" == "master" ]; then
                wget https://github.com/cli/cli/releases/download/v2.18.1/gh_2.18.1_linux_amd64.deb
                sudo apt install ./gh_2.18.1_linux_amd64.deb
                TAG_NAME="$(cat $TARGET_DIR/version | tr -d [:space:])"
                gh release create $TAG_NAME -t "$TAG_NAME $(git log -1 --pretty=%B)" -R scalableminds/fossildb --target $(git rev-parse HEAD) -n "Executable JAR of __FossilDB__" $TARGET_DIR/fossildb.jar
            fi

workflows:
  circleci_build:
    jobs:
      - build_and_push:
          context:
            - DockerHub
